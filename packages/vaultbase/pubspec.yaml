name: vaultbase
description: Dart client for Vaultbase, the single-binary backend. Records, auth, files and realtime.
version: 0.1.0
homepage: https://vaultbase.dev
repository: https://github.com/vaultbase-sh/sdk-dart/tree/main/packages/vaultbase
documentation: https://docs.vaultbase.dev/sdk-dart/quick-start/
issue_tracker: https://github.com/vaultbase-sh/sdk-dart/issues
topics:
  - backend
  - database
  - realtime
  - authentication
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  http: ^1.5.0
  http_parser: ^4.0.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: ^6.0.0
  crypto: ^3.0.0
  test: ^1.25.0
