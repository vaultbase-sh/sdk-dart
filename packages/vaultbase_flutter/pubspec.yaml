name: vaultbase_flutter
description: Flutter helpers for the Vaultbase client. Secure token storage, OAuth sign-in and app lifecycle.
version: 0.1.0
homepage: https://vaultbase.dev
repository: https://github.com/vaultbase-sh/sdk-dart/tree/main/packages/vaultbase_flutter
documentation: https://docs.vaultbase.dev/sdk-dart/quick-start/
issue_tracker: https://github.com/vaultbase-sh/sdk-dart/issues
topics:
  - backend
  - database
  - realtime
  - authentication
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  flutter_web_auth_2: ^5.0.0
  shared_preferences: ^2.3.0
  vaultbase: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.5.0
  lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.0
